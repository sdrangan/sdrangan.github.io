# SALSA investigators, used by scrape.py to find publications in OpenAlex.
# Only papers with at least one of these PIs as an author are tracked; papers
# by other co-authors or students alone are out of scope.
#
# awards: which NTIA awards the person is on (nofo1, nofo2). A paper's default
#         award is the union of its authors' awards; override it in decisions.yml.
# openalex_ids: one or more OpenAlex author IDs (A followed by digits). List
#         every profile if the person's papers are split across several.
# orcid: optional; used to check the OpenAlex match.
#
# Awards and personnel follow _pages/salsa-team.md.

awards:
  nofo1:
    name: "Testing for Open, Secure and Adaptive Spectrum Sharing in FR3"
    recipient: "New York University [36-60-IF003]"
    file: "NYU IF003 NOFO-1 products"   # output name; the report end date is appended
    start: 2023-01-01
  nofo2:
    name: "Spectrally Agile and Scalable Open Radio Units for the Upper Mid-Band"
    recipient: "New York University (NYU) [36-60-IF2419]"
    file: "NYU IF2419 NOFO-2 products"
    start: 2025-01-01

# Reports cover six-month periods ending 3/31 and 9/30. The scraper searches
# back to the award start; build.py keeps only items dated inside the period.
report:
  start: 2026-04-01
  end: 2026-09-30

