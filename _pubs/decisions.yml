# Manual decisions on the entries in candidates.yml, keyed by their id.
#
# An entry not listed here keeps its default awards from candidates.yml and is
# shown by build.py as "needs review" until it is listed. List every entry you
# have looked at, even when the default is right (award: default).
#
# Fields (all optional except award):
#   award:  nofo1, nofo2, both, exclude, or default (keep the scraped awards)
#   report: report end date (e.g. 2026-09-30) to put the entry in that report
#           even if its date falls outside the period, e.g. a late item
#   title, authors, venue, type, url, date: replace the scraped value
#   note:   your own comment; not written to the spreadsheet
#
# Example:
#   "arxiv:2604.02498":
#     award: both
#   "doi:10.1109/ojcoms.2026.3656868":
#     award: nofo2
#     venue: "IEEE Open Journal of the Communications Society"
#   "arxiv:2511.09464":
#     award: nofo2
#     report: 2026-09-30
#     note: "Missed in the 3/31 report"

