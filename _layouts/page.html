---
layout: default
---
<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
  </div>
</section>

<section class="page-body">
  <div class="container prose{% unless page.wide %} prose-narrow{% endunless %}">
{{ content }}
  </div>
</section>
