# Curated publications shown on the website (not a full list; see Google Scholar).
#
# Each paper appears on every project page named in `projects`, and under those
# projects on the Publications page, in the order listed in this file. Put the
# paper a reader should start with first.
#
# Project names are the ends of the project page URLs:
#   spectrally-agile-arrays, satellite-terrestrial-coexistence, fr3-prototyping,
#   hardware-co-design, wireless-robotic-navigation, falcon, waveflow
#
# Required: title, authors, venue, year, url, projects
# Optional: arxiv (shown as a link when url is not already arXiv), code, note
# Quote arXiv IDs so they stay text, e.g. arxiv: "2309.03038".

# ---------- Upper mid-band systems and SALSA ----------

- title: "Cellular Wireless Networks in the Upper Mid-Band"
  authors: "S. Kang, M. Mezzavilla, S. Rangan, A. Madanayake, S. B. Venkatakrishnan, G. Hellbourg, M. Ghosh, H. Rahmani, A. Dhananjay"
  venue: "IEEE Open Journal of the Communications Society"
  year: 2024
  url: https://doi.org/10.1109/OJCOMS.2024.3373368
  arxiv: "2309.03038"
  projects: [spectrally-agile-arrays, satellite-terrestrial-coexistence]
  note: "Start here. One of the first studies of cellular networks in the upper mid-band, and for several months among IEEE's 50 most-downloaded papers. It makes the case for wideband, spectrally agile FR3 systems through multi-band ray tracing, a satellite interference analysis, and a compact multi-band array design."

- title: "Upper Mid-Band Spectrum for 6G: Vision, Opportunity and Challenges"
  authors: "A. Bazzi, R. Bomfin, M. Mezzavilla, S. Rangan, T. S. Rappaport, M. Chafii"
  venue: "IEEE Communications Magazine"
  year: 2025
  url: https://doi.org/10.1109/MCOM.001.2500101
  arxiv: "2502.17914"
  projects: [spectrally-agile-arrays]

- title: "Terrestrial-Satellite Spectrum Sharing in the Upper Mid-Band with Interference Nulling"
  authors: "S. Kang, G. Geraci, M. Mezzavilla, S. Rangan"
  venue: "IEEE ICC"
  year: 2024
  url: https://doi.org/10.1109/ICC51166.2024.10622881
  arxiv: "2311.12965"
  projects: [spectrally-agile-arrays, satellite-terrestrial-coexistence]
  note: "One of the first studies of terrestrial-satellite spectrum sharing in the upper mid-band. It shows that base stations can steer nulls toward satellites, keeping interference to satellite uplinks below protection limits with negligible loss to terrestrial users."

- title: "Interference-Tolerant Mixer-First Receivers for FR3: Design Principles and Tradeoffs"
  authors: "R. Nikandish, H. Rahmani"
  venue: "arXiv preprint"
  year: 2026
  url: https://arxiv.org/abs/2608.22647
  projects: [spectrally-agile-arrays, hardware-co-design]

- title: "Spectrum Sharing and Spatial Isolation for 5G Cellular Networks and Military Radars in the FR1 Frequency Bands"
  authors: "C. N. Barati, A. Dhananjay, M. Zappe, P. Marques, L. Pereira, R. Magueta, S. Rangan, K. Gold, S. A. Hawkins, S. Shetty"
  venue: "IEEE MILCOM"
  year: 2025
  url: https://doi.org/10.1109/MILCOM64451.2025.11310615
  projects: [fr3-prototyping, falcon, spectrally-agile-arrays]

