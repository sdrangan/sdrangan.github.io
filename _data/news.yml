- date: "Nov 3, 2026"
  text: "Register for the NYU WIRELESS Board Meeting and Open House on Tuesday, Nov 3, at 370 Jay Street in Brooklyn. Meet our students at the poster session and see live lab demos. Registration closes Oct 23."
  link: "https://wp.nyu.edu/tandonschoolofengineering-wirelessboardmeeting"
  link_label: "Register"

- date: "Nov 3–5, 2026"
  text: "Our annual Brooklyn AI-Native 6G Summit, co-hosted by NYU WIRELESS and Nokia, returns with the theme “Networks at the dawn of the AI Supercycle.” Senior leaders from operators, vendors, and academia come together in Brooklyn to chart the path to AI-native 6G. Past speakers include executives from Nokia, Verizon, and NVIDIA."
  link: "https://www.b6gs.com/"
  link_label: "b6gs.com"

- date: "Oct 2026"
  text: "Watch our presentation of FALCON, our NSF VINES Track 2 project on resilient wireless links for drones and ground robots."
  link: "https://www.youtube.com/watch?v=zkoxwdPACqs"
  link_label: "Watch on YouTube"

- date: "Sep 2026"
  text: "Our group has received a nearly $4.7M NSF VINES award for FALCON, a project we are leading to build wireless technology that keeps drones connected as conditions change. Drones will sense their surroundings, switch frequencies, adjust flight paths, and relay links to other drones and ground robots. Partners include NC State, UC Berkeley, FIU, and industry collaborators."
  link: "https://engineering.nyu.edu/news/nyu-tandon-led-team-developing-wireless-technology-keep-drones-connected"
  link_label: "NYU Tandon news"
