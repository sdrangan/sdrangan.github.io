# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: "TORCH Lab"
subtitle: "Transceivers, Optimization, Radios & Co-design in Hardware"
tagline: "Transceivers, Optimization, Radios & Co-design in Hardware"  # used in the home page browser-tab title
name: "Sundeep Rangan"
description: >-
  TORCH Lab, the research group of Prof. Sundeep Rangan at NYU Tandon / NYU WIRELESS, working on
  next-generation wireless systems: upper mid-band (FR3) arrays, satellite-terrestrial
  co-existence, and algorithm-hardware co-design.
url: "https://sdrangan.github.io"
repository: "sdrangan/sdrangan.github.io"

# ---------------------------------------------------------------------------
# Branding (header, footer)
# ---------------------------------------------------------------------------
branding:
  tagline: "Rangan Group · NYU Tandon"
  # `logo` is shown in the white header (NYU WIRELESS logo), `logo_white` in
  # the violet footer (NYU torch; files in assets/images/nyu/, where "long"
  # versions spell out NEW YORK UNIVERSITY). Leave "" to hide.
  logo: "/assets/images/nyu-wireless/nyu-wireless-color.jpg"
  logo_alt: "NYU WIRELESS"
  logo_white: "/assets/images/nyu/nyu-short-white.svg"
  footer_blurb: >-
    Part of NYU WIRELESS and the Department of Electrical and Computer
    Engineering, NYU Tandon School of Engineering.

contact:
  email: "srangan@nyu.edu"
  office: "370 Jay St, Room 9.01, Brooklyn, NY 11201"
  scholar: "https://scholar.google.com/citations?user=fzSHXS8AAAAJ&hl=en&oi=ao"
  nyu_wireless: "http://wireless.engineering.nyu.edu/"

# Build settings ----------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:categories/:title/
timezone: America/New_York

include:
  - _pages

exclude:
  - README.md
  - admin.md
  - Gemfile
  - Gemfile.lock
  - material/
  - vendor/

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /research/:path/

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
