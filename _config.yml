# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: "Rangan Research Group"
subtitle: "Wireless Communications, Signal Processing & Hardware Co-Design"
name: "Sundeep Rangan"
description: >-
  Research group of Prof. Sundeep Rangan at NYU Tandon / NYU WIRELESS, working on
  next-generation wireless systems: upper mid-band (FR3) arrays, satellite-terrestrial
  co-existence, and algorithm-hardware co-design.
url: "https://sdrangan.github.io"
repository: "sdrangan/sdrangan.github.io"

# ---------------------------------------------------------------------------
# Branding (header, footer)
# ---------------------------------------------------------------------------
branding:
  tagline: "NYU WIRELESS · NYU Tandon"
  # NYU torch logo (files in assets/images/nyu/; "long" versions spell out
  # NEW YORK UNIVERSITY). `logo` is shown in the white header, `logo_white`
  # in the violet footer. Leave "" to hide.
  logo: "/assets/images/nyu/nyu-short-color.svg"
  logo_white: "/assets/images/nyu/nyu-short-white.svg"
  footer_blurb: >-
    Part of NYU WIRELESS and the Department of Electrical and Computer
    Engineering, NYU Tandon School of Engineering.

contact:
  email: "srangan@nyu.edu"
  office: "370 Jay St, Room 9.01, Brooklyn, NY 11201"
  scholar: "https://scholar.google.com/citations?user=fzSHXS8AAAAJ&hl=en&oi=ao"
  nyu_wireless: "http://wireless.engineering.nyu.edu/"

# Build settings ----------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:categories/:title/
timezone: America/New_York

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - material/
  - vendor/

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /research/:path/

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
